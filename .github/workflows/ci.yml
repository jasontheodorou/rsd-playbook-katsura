name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: lint, typecheck, build (no database)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Deliberately no DATABASE_URL: the build must not need a database.
      - run: npm run build
        env:
          PAYLOAD_SECRET: ci-build-only

  compose-smoke:
    name: company-shaped environment boots and answers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start
        run: docker compose -f docker/compose.yml up --build --wait --wait-timeout 300
      - name: Health (database reachable)
        run: curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors http://localhost:3019/api/health
      - name: Public page renders without JavaScript
        run: curl --fail --silent http://localhost:3019/ | grep -i 'katsura'
      - name: Admin answers
        run: curl --fail --silent --location --output /dev/null --write-out '%{http_code}' http://localhost:3019/admin
      - name: Logs on failure
        if: failure()
        run: docker compose -f docker/compose.yml logs
      - name: Stop
        if: always()
        run: docker compose -f docker/compose.yml down -v
